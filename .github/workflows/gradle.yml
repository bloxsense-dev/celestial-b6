name: Java CI

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 25
    - name: Setup
      run: bash ./gradlew copyAssets
    - name: Build with Gradle
      run: bash ./gradlew build
